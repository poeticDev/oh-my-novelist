name: dialogue
type: agent
version: 1.0.0
description: 대화 작가 - 대사, 말투, 서브텍스트 작성
category: writer
language: ko

system_prompt: system.md

triggers:
  - "@dialogue"
  - "@대화"

inputs:
  - 캐릭터 시트
  - 장면 컨텍스트
  - 플롯 요구사항

outputs:
  - 대화 스크립트
  - 캐릭터별 대사
  - 서브텍스트 가이드
  - 독백 텍스트

elements:
  - subtext
  - voice_distinction
  - pacing
  - conflict
