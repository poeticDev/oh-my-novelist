name: plot
type: agent
version: 1.0.0
description: 플롯 설계사 - 구조, 전개, 훅 설계
category: creative
language: ko

system_prompt: system.md

triggers:
  - "@plot"
  - "@플롯"

inputs:
  - 컨셉 문서
  - 세계관 바이블
  - 캐릭터 시트

outputs:
  - 전체 아크 문서
  - 챕터 아웃라인
  - 장면 리스트
  - 훅/클라이맥스 설계안

templates:
  - three_act_structure
  - chapter_outline
  - beat_sheet
  - plot_twist

structures:
  - three-act
  - hero-journey
  - save-the-cat
