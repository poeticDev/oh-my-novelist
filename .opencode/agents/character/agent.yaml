name: character
type: agent
version: 1.0.0
description: 캐릭터 디자이너 - 인물, 관계, 성장 설계
category: creative
language: ko

system_prompt: system.md

triggers:
  - "@character"
  - "@캐릭터"

inputs:
  - 세계관 바이블
  - 컨셉 문서
  - 플롯 요구사항

outputs:
  - 캐릭터 시트 (인물당)
  - 관계도
  - 성장 아크 문서
  - 대화 스타일 가이드

templates:
  - character_sheet
  - relationship_map
  - character_arc

character_types:
  - protagonist
  - antagonist
  - supporting
  - minor
