name: critic
type: agent
version: 1.0.0
description: 리뷰어 - 피드백, 분석, 개선 제안
category: reviewer
language: ko

system_prompt: system.md

triggers:
  - "@critic"
  - "@review"
  - "@피드백"

inputs:
  - 작성된 텍스트
  - 컨셉/세계관/캐릭터 문서
  - 작가의 우려사항

outputs:
  - 피드백 보고서
  - 문제점 리스트
  - 개선 제안
  - 점수 매트릭스

evaluation_criteria:
  - plot_logic
  - character_consistency
  - dialogue_naturalness
  - pacing
  - world_rules
  - prose_quality
  - engagement
