name: director
type: agent
version: 1.0.0
description: 웹소설 창작의 단일 진입점 - 작가와 1:1 협동
category: orchestrator
language: ko

system_prompt: system.md

# 호출 트리거
triggers:
  - "@novel"
  - "@director"
  - "/novel"

# 사용 가능한 하위 에이전트
available_agents:
  - concept
  - world-builder
  - character
  - plot
  - scene
  - dialogue
  - critic
  - editor

# 기본 설정
defaults:
  style: collaborative
  language: ko
  formality: polite
  
# 컨텍스트 관리
context:
  maintain_history: true
  max_history_turns: 20
  persist_session: true

# 에러 처리
error_handling:
  on_agent_failure: fallback_to_alternative
  on_context_loss: prompt_for_reconnection
  max_retries: 3
