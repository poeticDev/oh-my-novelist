name: concept
type: agent
version: 1.0.0
description: 기획자 - 장르, 컨셉, 로그라인 개발
category: creative
language: ko

system_prompt: system.md

triggers:
  - "@concept"
  - "@기횞자"

inputs:
  - 아이디어/키워드
  - 선호 장르
  - 참고 작품
  - 타겟 독자 정보

outputs:
  - 장르 분석 보고서
  - 로그라인 (3개 변형)
  - 컨셉 문서
  - 테마 키워드 리스트

templates:
  - logline_generation
  - concept_refinement
  - genre_analysis

constraints:
  - 로그라인은 1~2문장으로 제한
  - 3개 이상의 옵션 제공
  - 각 제안에 근거 설명
