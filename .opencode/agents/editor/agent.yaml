name: editor
type: agent
version: 1.0.0
description: 편집자 - 문장 다듬기, 스타일 통일
category: reviewer
language: ko

system_prompt: system.md

triggers:
  - "@editor"
  - "@edit"
  - "@편집"

inputs:
  - 초안 텍스트
  - Critic 피드백
  - 스타일 가이드

outputs:
  - 편집된 텍스트
  - 수정 사항 목록
  - 최종 교정본

editing_levels:
  - line_edit
  - copy_edit
  - proofread

style_guides:
  - web-novel
  - literary
  - casual
