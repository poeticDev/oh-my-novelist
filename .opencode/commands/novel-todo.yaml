name: novel-todo
description: Todo 관리 명령어

subcommands:
  show:
    description: 현재 Todo 목록 보기
    parameters:
      project_name:
        type: string
        required: true
  
  progress:
    description: 진행 상황 리포트
    parameters:
      project_name:
        type: string
        required: true
  
  next:
    description: 다음 작업으로 이동
    parameters:
      project_name:
        type: string
        required: true
  
  update:
    description: Todo 상태 업데이트
    parameters:
      project_name:
        type: string
        required: true
      todo_id:
        type: string
        required: true
      status:
        type: string
        enum: [pending, in_progress, completed, cancelled]
        required: true
      notes:
        type: string
        required: false
  
  add:
    description: 커스텀 Todo 추가
    parameters:
      project_name:
        type: string
        required: true
      content:
        type: string
        required: true
      phase:
        type: string
        enum: [planning, worldbuilding, character, plotting, writing, editing]
        default: planning
      priority:
        type: string
        enum: [low, medium, high, critical]
        default: medium

workflow:
  default:
    - name: execute_subcommand
      action: route_subcommand
      params:
        subcommand: "{{subcommand}}"

output:
  show: |
    📋 {{project_name}} - Todo 목록
    
    {{#each phases}}
    ### {{name}} ({{progress}}%)
    {{#each todos}}
    {{status_icon}} {{id}}: {{content}} [{{priority}}]
    {{/each}}
    {{/each}}
  
  progress: |
    📊 {{project_name}} - 진행 상황
    
    전체: {{overall_progress}}% ({{completed}}/{{total}})
    
    {{#each phase_progress}}
    {{name}}: {{bar}} {{percentage}}%
    {{/each}}
    
    🏆 최근 성과:
    {{#each recent_completions}}
    ✅ {{this}}
    {{/each}}
    
    💪 화이팅!
  
  update: |
    ✅ Todo 업데이트 완료
    
    {{todo_id}}: {{status}}
    {{#if notes}}
    📝 메모: {{notes}}
    {{/if}}
  
  add: |
    ➕ 새 Todo 추가됨
    
    {{content}}
    Phase: {{phase}}
    Priority: {{priority}}

examples:
  - command: /novel-todo show "마법사의 탑"
    description: Todo 목록 보기
  
  - command: /novel-todo progress "마법사의 탑"
    description: 진행 리포트
  
  - command: /novel-todo update "마법사의 탑" --todo_id P001 --status completed
    description: Todo 완료 표시
  
  - command: /novel-todo add "마법사의 탑" --content "특별한 배경 설정" --phase worldbuilding --priority high
    description: 커스텀 Todo 추가
