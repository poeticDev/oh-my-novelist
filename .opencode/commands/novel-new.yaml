name: novel-new
description: 새 웹소설 프로젝트 생성

parameters:
  project_name:
    type: string
    description: 작품명
    required: true
  
  template:
    type: string
    description: 사용할 템플릿
    enum: [default, fantasy, romance, thriller]
    default: default
    required: false
  
  path:
    type: string
    description: 프로젝트 저장 경로
    default: "~/Documents/novels"
    required: false
  
  obsidian_sync:
    type: boolean
    description: Obsidian 동기화 여부
    default: true
    required: false

workflow:
  steps:
    - name: validate_project_name
      action: validate_input
      params:
        field: project_name
        rules:
          - not_empty
          - no_special_chars
          - max_length: 50
    
    - name: generate_project_structure
      action: call_mcp
      mcp: template-generator
      method: generate
      params:
        project_name: "{{project_name}}"
        template: "{{template}}"
        output_path: "{{path}}"
    
    - name: create_todos
      action: call_mcp
      mcp: todo-manager
      method: create_project_todos
      params:
        project_name: "{{project_name}}"
        template: "{{template}}"
    
    - name: sync_to_obsidian
      action: conditional
      condition: "{{obsidian_sync}}"
      then:
        - call_mcp:
            mcp: obsidian-vault
            method: sync_project
            params:
              project_name: "{{project_name}}"
    
    - name: open_director
      action: call_agent
      agent: director
      prompt: |
        새 작품 "{{project_name}}"이 생성되었습니다.
        템플릿: {{template}}
        
        작가님에게 환영 인사와 함께
        첫 번째 작업을 제안해주세요.

output:
  success_message: |
    ✅ "{{project_name}}" 프로젝트가 생성되었습니다!
    
    📁 위치: {{path}}/{{project_name}}
    📋 템플릿: {{template}}
    📝 Todo: 30개 작업이 준비되었습니다
    
    바로 시작할까요?
  
  error_message: |
    ❌ 프로젝트 생성 중 오류가 발생했습니다.
    오류: {{error}}

examples:
  - command: /novel-new "마법사의 탑"
    description: 기본 템플릿으로 새 프로젝트
  
  - command: /novel-new "로맨스 소설" --template romance
    description: 로맨스 템플릿 사용
  
  - command: /novel-new "판타지" --template fantasy --path ~/Documents/my-novels
    description: 지정된 경로에 생성
