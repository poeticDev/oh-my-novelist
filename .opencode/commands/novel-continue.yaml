name: novel-continue
description: 기존 작품 이어서 작성

parameters:
  project_name:
    type: string
    description: 작품명 (일부 입력 가능)
    required: true
  
  agent:
    type: string
    description: 시작할 에이전트
    enum: [director, concept, world, character, plot, scene, dialogue, critic, editor]
    default: director
    required: false
  
  episode:
    type: integer
    description: 이동할 회차 번호
    required: false

workflow:
  steps:
    - name: find_project
      action: search_projects
      params:
        query: "{{project_name}}"
        path: "~/Documents/novels"
    
    - name: load_project_state
      action: call_mcp
      mcp: todo-manager
      method: get_current_todos
      params:
        project_name: "{{found_project_name}}"
    
    - name: show_progress
      action: display_progress
      params:
        project: "{{found_project_name}}"
        todos: "{{todos}}"
    
    - name: open_agent
      action: call_agent
      agent: "{{agent}}"
      context:
        project: "{{found_project_name}}"
        current_todos: "{{todos}}"
        last_session: "{{last_session}}"
      prompt: |
        "{{found_project_name}}" 작품을 이어서 작성합니다.
        
        현재 진행 상황:
        {{progress_summary}}
        
        작가님에게 현재 상태를 알리고
        다음 작업을 제안해주세요.

output:
  success_message: |
    📖 "{{found_project_name}}" 작품을 불러왔습니다.
    
    📊 진행 상황: {{progress_percentage}}%
    ✅ 완료: {{completed_count}}개
    🔄 진행중: {{in_progress_count}}개
    ⏳ 대기: {{pending_count}}개
    
    {{agent}}가 기다리고 있습니다!
  
  not_found_message: |
    ❌ "{{project_name}}" 작품을 찾을 수 없습니다.
    
    생성된 작품 목록:
    {{available_projects}}
    
    새로 생성하시려면:
    /novel-new "{{project_name}}"

examples:
  - command: /novel-continue "마법사"
    description: 작품명 일부로 검색
  
  - command: /novel-continue "마법사의 탑" --agent scene
    description: 특정 에이전트로 바로 시작
  
  - command: /novel-continue "마법사의 탑" --episode 5
    description: 5회차로 이동
